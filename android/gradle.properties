org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler cannot close its own caches on this toolchain:
# every `flutter build appbundle` died in :shared_preferences_android with
# "Could not close incremental caches ... class-fq-name-to-source.tab". It
# survives deleting the cache directory and stopping the daemons, so it is the
# incremental path itself rather than stale state. Full recompilation of a
# handful of plugin classes costs seconds; a release build that cannot run
# costs the release.
kotlin.incremental=false
